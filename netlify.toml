[build]
  # Netlify build settings for PCBot static deployment
  publish = "public"
  command = "echo 'No build required - static files'"

[[redirects]]
  # API redirects - for when backend is deployed elsewhere
  from = "/api/*"
  to = "https://your-backend-url.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  # SPA fallback - redirect all routes to index
  from = "/*"
  to = "/html/landing.html"
  status = 200

[[headers]]
  # Security headers
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self' 'unsafe-inline' 'unsafe-eval' https:; img-src 'self' data: https:; font-src 'self' data:;"

[[headers]]
  # Cache static assets
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[dev]
  # Local development server
  command = "python widget_api.py"
targetPort = 5001
  port = 8888
  publish = "public"
  autoLaunch = true
